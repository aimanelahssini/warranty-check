<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{HEAD}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #111113; --text: #232326; --muted: #74747c; --faint: #a3a3ab;
    --line: #e7e7e4; --soft: #f1f1ee; --hover: #ececea;
    --ok: #16a34a; --soon: #f97316; --bad: #e11d48; --neutral: #94a3b8;
    --ok-t: #15803d; --soon-t: #c2410c; --bad-t: #be123c;
    --focus: #2563eb;
    --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
    --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 16px -6px rgb(0 0 0 / .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0e10; --card: #18181b; --ink: #fafafa; --text: #e7e7ea; --muted: #9b9ba3; --faint: #6b6b73;
      --line: #2a2a2f; --soft: #212125; --hover: #27272c;
      --ok-t: #4ade80; --soon-t: #fdba74; --bad-t: #fb7185;
      --focus: #60a5fa;
      --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 8px 24px -10px rgb(0 0 0 / .6);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font: 15px/1.55 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
         font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }

  .wrap { max-width: 680px; margin: 0 auto; padding: clamp(20px, 5vw, 48px) 16px 40px; }

  /* Top */
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .top img { flex: none; width: 40px; height: 40px; }
  h1 { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.025em; font-weight: 700; color: var(--ink); }
  .lead { margin: 1px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

  /* Search panel */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; box-shadow: var(--shadow); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 2px 2px 12px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .ghost { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card);
           border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 13px; font-weight: 500; color: var(--text); }
  .ghost:hover { background: var(--hover); }
  .ghost svg { width: 15px; height: 15px; }

  .brands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .brand { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
           height: 92px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--soft); color: var(--ink);
           transition: background .15s, border-color .15s, color .15s, transform .15s; }
  .brand:hover { background: var(--hover); }
  .brand:active { transform: scale(.98); }
  .brand[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .brand small { font-size: 11px; font-weight: 500; color: var(--muted); }
  .brand[aria-pressed="true"] small { color: color-mix(in srgb, var(--bg) 70%, transparent); }
  .logo { display: block; width: 30px; height: 30px; background: currentColor;
          -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; }
  .logo.wide { width: 72px; height: 24px; }

  .field { display: flex; gap: 8px; margin-top: 14px; }
  .field input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border-radius: var(--r-md);
                 border: 1px solid var(--line); background: var(--card); color: var(--ink);
                 font-size: 17px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
                 transition: border-color .15s, box-shadow .15s; }
  .field input::placeholder { color: var(--faint); letter-spacing: 0; text-transform: none; font-weight: 400; }
  .field input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 18%, transparent); }
  .go { height: 52px; padding: 0 24px; border: 0; border-radius: var(--r-md); background: var(--ink); color: var(--bg);
        font-weight: 600; transition: opacity .15s; }
  .go:hover { opacity: .88; }
  .go:disabled { opacity: .45; cursor: default; }
  .under { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap;
           margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
  .link { border: 0; background: none; padding: 0; color: var(--text); font-size: 13px; font-weight: 500;
          text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .link:hover { text-decoration-color: currentColor; }

  .help { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 12px; font-size: 13px; }
  .help h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--ink); }
  .help p { margin: 0; color: var(--muted); }
  .cmd { display: flex; align-items: center; gap: 8px; background: var(--soft); border: 1px solid var(--line);
         border-radius: var(--r-sm); padding: 5px 5px 5px 12px; }
  .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); }
  .mini { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 3px 10px;
          font-size: 12px; font-weight: 600; }
  .mini:hover { background: var(--hover); }

  /* Recent */
  .recent { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 18px; }
  .recent:empty { display: none; }
  .recent .label { margin-right: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px 0 10px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 500;
          font-variant-numeric: tabular-nums; letter-spacing: .03em; color: var(--text); }
  .chip:hover { background: var(--hover); }
  .chip .logo { width: 14px; height: 14px; color: var(--muted); }
  .chip .logo.wide { width: 40px; height: 13px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--neutral); flex: none; }
  .dot.ok { background: var(--ok); } .dot.soon { background: var(--soon); } .dot.bad { background: var(--bad); }

  /* Result */
  #out { position: relative; margin-bottom: 20px; }
  #out:empty { display: none; }
  .halo { position: absolute; inset: 10% 6% -4%; z-index: 0; border-radius: 40px; pointer-events: none;
          background: radial-gradient(60% 70% at 30% 30%, var(--s), transparent 70%),
                      radial-gradient(60% 70% at 75% 75%, var(--s), transparent 70%);
          filter: blur(40px); opacity: .55; animation: glow .6s ease both; }
  @media (prefers-color-scheme: dark) { .halo { opacity: .38; } }
  @keyframes glow { from { opacity: 0; transform: scale(.9); } }
  .card { position: relative; z-index: 1; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
          padding: clamp(18px, 4vw, 26px); box-shadow: var(--shadow); animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .card.tinted { background:
      radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--s) 13%, transparent), transparent 60%), var(--card);
    border-color: color-mix(in srgb, var(--s) 18%, var(--line)); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .s-ok { --s: var(--ok); --st: var(--ok-t); } .s-soon { --s: var(--soon); --st: var(--soon-t); } .s-bad { --s: var(--bad); --st: var(--bad-t); }
  .s-none { --s: var(--neutral); --st: var(--muted); }

  .hero { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; }
  .pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px;
          font-size: 12.5px; font-weight: 600; color: var(--st);
          background: color-mix(in srgb, var(--s) 12%, var(--card)); }
  .pill .dot { background: var(--s); box-shadow: 0 0 0 3px color-mix(in srgb, var(--s) 25%, transparent); }
  .big { margin: 12px 0 2px; font-size: clamp(26px, 6vw, 34px); line-height: 1.1; font-weight: 700; letter-spacing: -.03em; color: var(--ink); }
  .sub { margin: 0; color: var(--muted); }
  .sub b { color: var(--text); font-weight: 600; }
  .photo { flex: none; width: clamp(96px, 24vw, 150px); aspect-ratio: 4/3; object-fit: contain; border-radius: var(--r-md);
           background: #fff; padding: 8px; border: 1px solid var(--line); }

  .bar { height: 6px; border-radius: 999px; margin: 20px 0 6px; overflow: hidden;
         background: color-mix(in srgb, var(--s) 14%, var(--soft)); }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--s); transform-origin: left;
           animation: fill .8s .15s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes fill { from { transform: scaleX(0); } }
  .bar-l { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .device { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .device h2 { margin: 0; font-size: 16px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .device p { margin: 2px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; margin-top: 16px; }
  @media (min-width: 600px) { .facts { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
                              .facts.few { grid-auto-columns: minmax(0, 190px); } }
  .fact { background: var(--soft); border-radius: var(--r-sm); padding: 8px 9px; min-width: 0; }
  .fact span { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fact b { display: block; margin-top: 1px; font-size: 12.5px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cover { list-style: none; margin: 8px 0 0; padding: 0; }
  .cover li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .cover li:first-child { border-top: 0; }
  .cover b { font-weight: 500; color: var(--ink); }
  .cover small { display: block; color: var(--muted); font-size: 12px; }
  .cover .d { flex: none; text-align: end; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .cover li.past b { color: var(--muted); }
  .cover-h { margin: 22px 0 0; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 16px;
         border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
         font-size: 13.5px; font-weight: 600; text-decoration: none; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { opacity: .88; background: var(--ink); }

  .loading { display: flex; align-items: center; gap: 12px; color: var(--muted); }
  .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--ink); animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between;
           align-items: flex-start; gap: 12px 24px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  footer p { margin: 0; max-width: 400px; }
  .foot-r { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .lang { position: relative; display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
  .lang svg { width: 15px; height: 15px; position: absolute; inset-inline-start: 10px; pointer-events: none; }
  .lang select { appearance: none; -webkit-appearance: none; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--text);
                 background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px 5px 31px; cursor: pointer; }
  .lang select:hover { background: var(--hover); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* FAQ */
  .faq { margin-top: 36px; }
  .faq h2 { margin: 0 0 8px 2px; }
  .faq details { border-top: 1px solid var(--line); }
  .faq details:last-child { border-bottom: 1px solid var(--line); }
  .faq summary { list-style: none; cursor: pointer; padding: 13px 2px; font-weight: 500; color: var(--ink); display: flex; justify-content: space-between; gap: 16px; }
  .faq summary::-webkit-details-marker { display: none; }
  .faq summary::after { content: "+"; color: var(--muted); font-weight: 400; font-size: 18px; line-height: 1; transition: transform .2s; }
  .faq details[open] summary::after { transform: rotate(45deg); }
  .faq details p { margin: 0 2px 14px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--ink); font-weight: 600; text-decoration: none; }
  footer a:hover { text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 520px) {
    .foot-r { align-items: flex-start; }
    .brands { grid-template-columns: repeat(2, 1fr); }
    .brand { height: 78px; }
    .field { flex-direction: column; }
    .field input { flex: none; width: 100%; }
    .go { width: 100%; }
    .hero { flex-direction: column-reverse; }
    .photo { width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>

</head>
<body>
<main class="wrap">
  <header class="top"><img src="/icon.svg" alt="" width="40" height="40">
    <div><h1>{{appName}}</h1><p class="lead">{{lead}}</p></div>
  </header>

  <div id="out" aria-live="polite"></div>

  <section class="panel" aria-label="{{check}}">
    <div class="panel-head">
      <span class="label">{{brand}}</span>
      <button class="ghost" id="me" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>
        {{detect}}
      </button>
    </div>
    <div class="brands" role="group" aria-label="{{brand}}">
      <button class="brand" data-b="lenovo" aria-label="Lenovo / ThinkPad" title="Lenovo / ThinkPad"><span class="logo wide" style="--m:url(/logos/lenovo.svg)"></span><small>{{tagInstant}}</small></button>
      <button class="brand" data-b="hp" aria-label="HP" title="HP"><span class="logo" style="--m:url(/logos/hp.svg)"></span><small>{{tagModel}}</small></button>
      <button class="brand" data-b="dell" aria-label="Dell" title="Dell"><span class="logo" style="--m:url(/logos/dell.svg)"></span><small>{{tagInfo}}</small></button>
      <button class="brand" data-b="apple" aria-label="Apple" title="Apple"><span class="logo" style="--m:url(/logos/apple.svg)"></span><small>{{tagModel}}</small></button>
    </div>
    <form class="field" id="f">
      <input id="serial" placeholder="{{placeholder}}" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="{{placeholder}}">
      <button class="go" id="go">{{check}}</button>
    </form>
    <div class="under">
      <span id="hint">{{hintDefault}}</span>
      <button class="link" id="where" aria-expanded="false" aria-controls="help">{{where}}</button>
    </div>
    <div class="help" id="help" hidden>
      <div><h3>{{helpSticker}}</h3><p>{{helpStickerText}}</p></div>
      <div><h3>{{helpWin}}</h3><div class="cmd"><code dir="ltr">(Get-CimInstance Win32_BIOS).SerialNumber</code><button class="mini" data-copy>{{copy}}</button></div></div>
      <div><h3>{{helpLinux}}</h3><div class="cmd"><code dir="ltr">sudo cat /sys/class/dmi/id/product_serial</code><button class="mini" data-copy>{{copy}}</button></div></div>
      <div><h3>{{helpMac}}</h3><p>{{helpMacText}}</p></div>
    </div>
  </section>

  <div class="recent" id="recent"></div>

  <section class="faq" aria-labelledby="faq-h">
    <h2 id="faq-h" class="label">{{faqTitle}}</h2>
    {{FAQ}}
  </section>

  <footer>
    <p>{{footerNote}}</p>
    <div class="foot-r">
      <label class="lang"><span class="sr">{{language}}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg>
        <select id="lang" aria-label="{{language}}">{{LANG_OPTIONS}}</select>
      </label>
      <span>{{madeBy}} <a href="https://www.enamia.eu" target="_blank" rel="noopener">eNamia</a></span>
    </div>
  </footer>
</main>

<script>
const LANG = "{{LANG}}", LANGS = {{LANGS_JSON}}, T = {{T_JSON}};
const tr = (k, v = {}) => (T[k] || k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const pathFor = c => (c === "en" ? "/" : `/${c}/`) + location.search;

// Automatic language: the English home page sends first-time visitors to their browser's language.
if (LANG === "en" && location.pathname === "/" && !store.get("lang", null)) {
  const want = (navigator.languages || [navigator.language]).map(l => String(l).toLowerCase().split("-")[0]).find(l => LANGS.includes(l));
  if (want && want !== "en") location.replace(pathFor(want));
}

const $ = s => document.querySelector(s);
const out = $("#out"), input = $("#serial"), go = $("#go");
const NAMES = { lenovo: "Lenovo", hp: "HP", dell: "Dell", apple: "Apple" };
const HINTS = { lenovo: "hintLenovo", hp: "hintHp", dell: "hintDell", apple: "hintApple" };
let brand = null;

$("#lang").onchange = e => { store.set("lang", e.target.value); location.href = pathFor(e.target.value); };

function pick(b) {
  brand = b;
  document.querySelectorAll(".brand").forEach(el => el.setAttribute("aria-pressed", el.dataset.b === b));
  $("#hint").textContent = tr(HINTS[b]);
  store.set("brand", b);
}
document.querySelectorAll(".brand").forEach(el => el.onclick = () => { pick(el.dataset.b); input.focus(); });

// Guess the brand from the serial's shape when none is picked.
function guess(s) {
  if (/^[A-Z0-9]{7}$/.test(s)) return "dell";
  if (/^[A-Z0-9]{8}$/.test(s)) return "lenovo";
  if (/^\d[A-Z]{2}[A-Z0-9]{7}$/.test(s)) return "hp";
  return null;
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mini = b => `<span class="logo${b === "lenovo" ? " wide" : ""}" role="img" aria-label="${NAMES[b]}" style="--m:url(/logos/${b}.svg)"></span>`;
const today = new Date().toISOString().slice(0, 10);
const fmt = d => d ? new Date(d + "T00:00").toLocaleDateString(LANG, { day: "numeric", month: "short", year: "numeric" }) : "—";
const daysUntil = d => Math.round((new Date(d + "T00:00") - new Date(today + "T00:00")) / 864e5);
const unit = (n, u) => new Intl.NumberFormat(LANG, { style: "unit", unit: u, unitDisplay: "long", maximumFractionDigits: 1 }).format(n);
function span(days) {
  const n = Math.abs(days);
  if (n < 62) return unit(n, "day");
  const m = Math.round(n / 30.4);
  return m < 24 ? unit(m, "month") : unit(Math.round(n / 36.5) / 10, "year");
}
function country(code) {
  try { return new Intl.DisplayNames([LANG], { type: "region" }).of(code) || code; } catch { return code; }
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); } catch { return; }
  const was = btn.textContent; btn.textContent = tr("copied"); setTimeout(() => btn.textContent = was, 1500);
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]");
  if (b) copy(b.dataset.copy || b.previousElementSibling.textContent, b);
});

// Render a result card. `state` (ok / soon / bad) adds the coloured glow coming out of the card.
function render(state, html) {
  const s = state || "none";
  out.innerHTML = `${state ? '<div class="halo s-' + s + '"></div>' : ""}<div class="card s-${s}${state ? " tinted" : ""}">${html}</div>`;
  out.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
const loading = text => render(null, `<div class="loading"><span class="spin"></span>${esc(text)}</div>`);
const message = (title, text) => render(null, `<span class="pill"><span class="dot"></span>${esc(title)}</span><p class="sub" style="margin-top:12px">${esc(text)}</p>`);

// Recent checks, newest first.
function remember(entry) {
  const list = store.get("recent", []).filter(r => !(r.brand === entry.brand && r.serial === entry.serial));
  store.set("recent", [entry, ...list].slice(0, 8));
  drawRecent();
}
function drawRecent() {
  const list = store.get("recent", []);
  $("#recent").innerHTML = list.length ? `<span class="label">${esc(tr("recent"))}</span>` + list.map((r, i) =>
    `<button class="chip" data-i="${i}" title="${esc(r.model || NAMES[r.brand])}"><span class="dot ${r.state || ""}"></span>${mini(r.brand)}<span dir="ltr">${esc(r.serial)}</span></button>`).join("")
    + `<button class="link" id="clear">${esc(tr("clear"))}</button>` : "";
}
$("#recent").onclick = e => {
  if (e.target.id === "clear") { store.set("recent", []); drawRecent(); return; }
  const c = e.target.closest(".chip");
  if (!c) return;
  const r = store.get("recent", [])[c.dataset.i];
  pick(r.brand); input.value = r.serial; check();
};

function factTiles(facts) {
  const list = Object.entries(facts).filter(([, v]) => v);
  if (!list.length) return "";
  return `<div class="facts${list.length < 4 ? " few" : ""}">` + list.map(([k, v]) => {
    const shown = k === "made" ? new Date(v + "T00:00").toLocaleDateString(LANG, { month: "long", year: "numeric" })
      : /^\d{4}-\d\d-\d\d$/.test(v) ? fmt(v) : k === "shippedTo" ? country(v) : v;
    return `<div class="fact"><span>${esc(tr(k))}</span><b title="${esc(shown)}">${esc(shown)}</b></div>`;
  }).join("") + "</div>";
}

function showFull(r) {
  const ok = r.inWarranty, d = r.end ? daysUntil(r.end) : null;
  const state = ok && d !== null && d <= 92 ? "soon" : ok ? "ok" : "bad";
  const label = tr({ ok: "inWarranty", soon: "endsSoon", bad: "outWarranty" }[state]);
  const big = d === null ? label : d >= 0 ? tr("left", { t: span(d) }) : tr("ago", { t: span(d) });
  const img = /^https:\/\//.test(r.image || "") ? `<img class="photo" src="${esc(r.image)}" alt="${esc(r.model)}" onerror="this.remove()">` : "";
  const start = r.items.filter(w => w.end === r.end).map(w => w.start).sort()[0];
  let bar = "";
  if (start && r.end) {
    const total = daysUntil(r.end) - daysUntil(start);
    const pct = total > 0 ? Math.min(100, Math.max(0, 100 * -daysUntil(start) / total)) : 100;
    bar = `<div class="bar" role="img" aria-label="${esc(tr("used", { n: Math.round(pct) }))}"><i style="width:${pct}%"></i></div>
      <div class="bar-l"><span>${fmt(start)}</span><span>${fmt(r.end)}</span></div>`;
  }
  const cover = r.items.map(w => `<li class="${w.end < today ? "past" : ""}"><div><b>${esc(w.name)}</b><small>${esc(w.type)}</small></div>
      <div class="d">${fmt(w.start)}<br>${document.dir === "rtl" ? "←" : "→"} ${fmt(w.end)}</div></li>`).join("");
  const summary = `${r.model} (S/N ${r.serial}): ${tr(ok ? "summaryIn" : "summaryOut")} ${fmt(r.end)}`;
  render(state, `
    <div class="hero">
      <div>
        <span class="pill"><span class="dot"></span>${esc(label)}</span>
        <p class="big">${esc(big)}</p>
        <p class="sub">${esc(tr(ok ? "coveredUntil" : "endedOn"))} <b>${fmt(r.end)}</b></p>
      </div>${img}
    </div>
    ${bar}
    <div class="device"><h2>${esc(r.model)}</h2><p dir="ltr">S/N ${esc(r.serial)} · ${esc(r.product)}</p></div>
    ${factTiles(r.facts)}
    <p class="cover-h">${esc(tr("coverage"))}</p><ul class="cover">${cover}</ul>
    <div class="actions"><button class="btn primary" data-copy="${esc(summary)}">${esc(tr("copySummary"))}</button>
      <a class="btn" href="${esc(r.link)}" target="_blank" rel="noopener">${esc(tr("openOn", { brand: "Lenovo" }))} ↗</a></div>`);
  return state;
}

function showPartial(r) {
  const b = r.brand, name = NAMES[b];
  const note = b === "hp" ? tr("hpNote") : b === "dell" ? tr("dellNote") : (r.random ? tr("appleRandom") + " " : "") + tr("appleNote");
  const copySerial = b === "hp" ? "" : `<button class="btn" data-copy="${esc(r.serial)}">${esc(tr("copySerial"))}</button>`;
  render(null, `<span class="pill"><span class="dot"></span>${esc(tr(r.model ? "modelFound" : "deviceInfo"))}</span>
    <p class="big" style="font-size:clamp(20px,4.5vw,26px)">${esc(r.model || tr("unknownModel", { brand: name }))}</p>
    <p class="sub" dir="ltr">S/N ${esc(r.serial)}</p>
    ${factTiles(r.facts)}
    <p class="sub" style="margin-top:16px">${esc(note)}</p>
    <div class="actions"><a class="btn primary" href="${esc(r.link)}" target="_blank" rel="noopener"${b === "apple" ? ` data-copy="${esc(r.serial)}"` : ""}>${esc(tr("checkOn", { brand: name }))} ↗</a>${copySerial}</div>`);
}

async function check() {
  const serial = input.value.trim().toUpperCase().replace(/[\s-]+/g, "");
  if (!serial) { input.focus(); return; }
  if (!brand) {
    const g = guess(serial);
    if (!g) return message(tr("whichBrand"), tr("whichBrandText"));
    pick(g);
  }
  history.replaceState(null, "", `?brand=${brand}&serial=${encodeURIComponent(serial)}`);
  const b = brand;
  go.disabled = true;
  loading(tr("asking", { brand: NAMES[b] }));
  try {
    const r = await (await fetch(`/api/${b}?serial=${encodeURIComponent(serial)}&lang=${LANG}`)).json();
    if (!r.ok) {
      if (r.error === "badSerial") return message(tr("notFound"), tr("badSerial"));
      if (r.error === "badFormat") return message(tr("checkSerial"), tr(HINTS[b]));
      if (r.error === "unreachable") return message(tr("netTitle"), tr("netText"));
      return message(tr("notFound"), tr("notFoundText", { brand: NAMES[b] }));
    }
    const state = r.full ? showFull(r) : (showPartial(r), null);
    remember({ brand: b, serial, model: r.model, state });
  } catch {
    message(tr("netTitle"), tr("netText"));
  } finally { go.disabled = false; }
}
$("#f").onsubmit = e => { e.preventDefault(); check(); };
// Escape clears. Checks only start from the Check button (or Enter), never while typing or pasting.
input.addEventListener("keydown", e => { if (e.key === "Escape") { input.value = ""; out.innerHTML = ""; } });

$("#where").onclick = () => {
  const help = $("#help"), open = help.hidden;
  help.hidden = !open; $("#where").setAttribute("aria-expanded", open);
};

// "Detect this computer" only exists when running locally (the server can read this machine's firmware).
fetch("/api/this").then(r => r.ok ? r.json() : null).then(info => {
  if (info && "vendor" in info) $("#me").hidden = false;
}).catch(() => {});
$("#me").onclick = async () => {
  loading(tr("reading"));
  try {
    const r = await (await fetch("/api/this?root=1")).json();
    const v = r.vendor.toLowerCase();
    const b = v.includes("lenovo") ? "lenovo" : /\bhp\b|hewlett/.test(v) ? "hp" : v.includes("dell") ? "dell" : v.includes("apple") ? "apple" : null;
    if (b) pick(b);
    if (r.serial) input.value = r.serial;
    if (r.serial && b) check();
    else if (r.serial) message(`${r.vendor} ${r.model}`, tr("unsupported"));
    else message(`${r.vendor} ${r.model}`, tr("noSerial"));
  } catch { message(tr("cantDetect"), tr("cantDetectText")); }
};

drawRecent();
const params = new URLSearchParams(location.search);
const startBrand = params.get("brand"), startSerial = params.get("serial");
if (NAMES[startBrand]) pick(startBrand); else if (store.get("brand", null) in NAMES) pick(store.get("brand"));
if (startSerial) { input.value = startSerial; check(); } else if (matchMedia("(min-width: 600px)").matches) input.focus();
</script>
</body>
</html>
