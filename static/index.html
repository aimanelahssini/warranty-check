<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warranty Check</title>
<style>
  :root {
    --bg: #f5f5f7; --card: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e8;
    --ok: #1a7f37; --ok-bg: #e7f5ec; --bad: #c62828; --bad-bg: #fdecec; --warn: #9a6700; --warn-bg: #fff6dd;
    --focus: #0a66d8; --apple: #1d1d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1f1f23; --text: #f2f2f5; --muted: #a0a0a8; --line: #33333a;
      --ok: #5fd07e; --ok-bg: #16301f; --bad: #ff7a7a; --bad-bg: #3a1a1a; --warn: #f0c14b; --warn-bg: #3a2f12;
      --focus: #5aa2ff; --apple: #f2f2f5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Cantarell, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .brands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .brand { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 18px 8px 12px;
           cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 10px;
           color: var(--text); font: inherit; transition: border-color .15s, transform .15s; }
  .brand:hover { transform: translateY(-2px); }
  .brand[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
  .brand:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .logo { width: 44px; height: 44px; background: var(--c); -webkit-mask: var(--m) center/contain no-repeat; mask: var(--m) center/contain no-repeat; }
  .brand[data-b="lenovo"] .logo { width: 84px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 10px; margin-top: 20px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 18px; letter-spacing: .06em; text-transform: uppercase;
          padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--text); }
  input:focus { outline: none; border-color: var(--focus); }
  button.go { font: inherit; font-weight: 600; padding: 0 22px; border: 0; border-radius: 12px; cursor: pointer;
              background: var(--text); color: var(--bg); }
  button.go:disabled { opacity: .5; cursor: default; }
  .links { margin-top: 10px; font-size: 14px; color: var(--muted); }
  .links button { font: inherit; background: none; border: 0; color: var(--focus); cursor: pointer; padding: 0; }
  .result { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .result:empty { display: none; }
  .badge { display: inline-block; font-weight: 700; padding: 4px 12px; border-radius: 999px; font-size: 14px; }
  .badge.ok { color: var(--ok); background: var(--ok-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .head { display: flex; gap: 20px; align-items: center; }
  .photo { width: 140px; height: 105px; object-fit: contain; flex: none; background: #fff; border-radius: 10px; padding: 6px; }
  @media (max-width: 560px) { .head { flex-direction: column; align-items: flex-start; } }
  .model { font-size: 20px; font-weight: 650; margin: 10px 0 2px; }
  .muted { color: var(--muted); }
  .big { font-size: 15px; margin: 6px 0 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  td.d { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .past { color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 16px 0 0; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
  a.open { display: inline-block; margin-top: 16px; color: var(--focus); font-weight: 600; text-decoration: none; }
  .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--text);
          border-radius: 50%; animation: s .7s linear infinite; vertical-align: -3px; margin-right: 8px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (max-width: 560px) {
    .brands { grid-template-columns: repeat(2, 1fr); }
    table th:nth-child(2), table td:nth-child(2) { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Warranty Check</h1>
  <p class="sub">Pick the brand, paste the serial, press Enter.</p>

  <div class="brands" role="group" aria-label="Brand">
    <button class="brand" data-b="lenovo" style="--c:#E2231A;--m:url(logos/lenovo.svg)"><span class="logo"></span>Lenovo<small>ThinkPad · IdeaPad</small></button>
    <button class="brand" data-b="hp" style="--c:#0096D6;--m:url(logos/hp.svg)"><span class="logo"></span>HP<small>EliteBook · ProBook</small></button>
    <button class="brand" data-b="dell" style="--c:#007DB8;--m:url(logos/dell.svg)"><span class="logo"></span>Dell<small>Latitude · XPS</small></button>
    <button class="brand" data-b="apple" style="--c:var(--apple);--m:url(logos/apple.svg)"><span class="logo"></span>Apple<small>MacBook · iPhone</small></button>
  </div>

  <form class="row" id="f">
    <input id="serial" placeholder="Serial number" autocomplete="off" spellcheck="false" aria-label="Serial number">
    <button class="go" id="go">Check</button>
  </form>
  <div class="links">This computer: <button id="me">fill in brand and serial</button></div>

  <div class="result" id="out" aria-live="polite"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const out = $("#out"), input = $("#serial"), go = $("#go");
let brand = null;
try { brand = localStorage.getItem("brand"); } catch {}

function pick(b) {
  brand = b;
  document.querySelectorAll(".brand").forEach(el => el.setAttribute("aria-pressed", el.dataset.b === b));
  try { localStorage.setItem("brand", b); } catch {}
  input.focus();
}
document.querySelectorAll(".brand").forEach(el => el.onclick = () => pick(el.dataset.b));
if (brand) pick(brand);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = new Date().toISOString().slice(0, 10);
function fmt(d) { return d ? new Date(d + "T00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function left(end) {
  const days = Math.round((new Date(end + "T00:00") - new Date(today + "T00:00")) / 864e5);
  if (days < 0) return `ended ${-days} day${days === -1 ? "" : "s"} ago`;
  if (days < 62) return `${days} days left`;
  return `${Math.round(days / 30.4)} months left`;
}

function showFull(r) {
  const ok = r.inWarranty;
  const rows = r.items.map(w => `<tr class="${w.end < today ? "past" : ""}">
      <td>${esc(w.name)}</td><td>${esc(w.type)}</td><td class="d">${fmt(w.start)}</td><td class="d">${fmt(w.end)}</td></tr>`).join("");
  const facts = Object.entries(r.facts).filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(/^\d{4}-\d\d-\d\d$/.test(v) ? fmt(v) : v)}</dd>`).join("");
  const img = /^https:\/\//.test(r.image || "") ? `<img class="photo" src="${esc(r.image)}" alt="" onerror="this.remove()">` : "";
  out.innerHTML = `<div class="head">${img}<div>
    <span class="badge ${ok ? "ok" : "bad"}">${ok ? "In warranty" : "Out of warranty"}</span>
    <div class="model">${esc(r.model)}</div>
    <div class="muted">Serial ${esc(r.serial)} · ${esc(r.product)}</div></div></div>
    ${r.end ? `<p class="big">${ok ? "Covered until" : "Ended on"} <b>${fmt(r.end)}</b> (${left(r.end)})</p>` : ""}
    <table><tr><th>Coverage</th><th>Service</th><th>Start</th><th>End</th></tr>${rows}</table>
    <dl>${facts}</dl>
    <a class="open" href="${esc(r.link)}" target="_blank" rel="noopener">Open on the brand's site →</a>`;
}

function showPartial(r) {
  const facts = Object.entries(r.facts).filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  out.innerHTML = `<span class="badge warn">Model found</span>
    <div class="model">${esc(r.model)}</div>
    <div class="muted">Serial ${esc(r.serial)}</div>
    <p class="big">${esc(r.note)}</p><dl>${facts}</dl>
    <a class="open" href="${esc(r.link)}" target="_blank" rel="noopener">See warranty dates on HP →</a>`;
}

function handOff(name, url, msg) {
  out.innerHTML = `<span class="badge warn">Opened ${name}</span><p class="big">${msg}</p>
    <a class="open" href="${esc(url)}" target="_blank" rel="noopener">Open again →</a>`;
  window.open(url, "_blank", "noopener");
}

async function check() {
  const serial = input.value.trim().toUpperCase().replace(/\s+/g, "");
  if (!brand) { out.innerHTML = `<p class="big">Pick a brand first.</p>`; return; }
  if (!serial) { input.focus(); return; }
  if (brand === "dell") return handOff("Dell", `https://www.dell.com/support/home/en-us/product-support/servicetag/${encodeURIComponent(serial)}/overview`,
    "Dell blocks direct lookups, so the warranty page for this service tag opened in a new tab.");
  if (brand === "apple") {
    try { await navigator.clipboard.writeText(serial); } catch {}
    return handOff("Apple", "https://checkcoverage.apple.com/",
      "Apple requires a captcha for every lookup. The serial is copied: paste it with Ctrl+V and solve the captcha.");
  }
  go.disabled = true;
  out.innerHTML = `<p class="big"><span class="spin"></span>Asking ${brand === "hp" ? "HP" : "Lenovo"}…</p>`;
  try {
    const r = await (await fetch(`/api/${brand}?serial=${encodeURIComponent(serial)}`)).json();
    if (!r.ok) out.innerHTML = `<span class="badge bad">Not found</span><p class="big">${esc(r.error)}</p>`;
    else (r.full ? showFull : showPartial)(r);
  } catch {
    out.innerHTML = `<span class="badge bad">Error</span><p class="big">The local server isn't running. Start it with <code>warranty</code>.</p>`;
  } finally { go.disabled = false; }
}
$("#f").onsubmit = e => { e.preventDefault(); check(); };

$("#me").onclick = async () => {
  out.innerHTML = `<p class="big"><span class="spin"></span>Reading this computer's serial (it may ask for your password)…</p>`;
  try {
    const r = await (await fetch("/api/this?root=1")).json();
    const v = r.vendor.toLowerCase();
    const b = v.includes("lenovo") ? "lenovo" : v.includes("hp") || v.includes("hewlett") ? "hp" : v.includes("dell") ? "dell" : v.includes("apple") ? "apple" : null;
    if (b) pick(b);
    if (r.serial) { input.value = r.serial; check(); }
    else out.innerHTML = `<p class="big">This is a ${esc(r.vendor)} ${esc(r.model)}, but the serial couldn't be read. Type it from the sticker underneath.</p>`;
  } catch { out.innerHTML = `<p class="big">The local server isn't running.</p>`; }
};
</script>
</body>
</html>
